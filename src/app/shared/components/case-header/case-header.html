<div class="mb-8">
  <button (click)="goBack()" class="flex items-center gap-2 text-gray-600 hover:text-gray-800 hover:underline mb-6 text-sm font-medium">
    <lucide-icon name="arrow-left" class="flex w-4 h-4"></lucide-icon>
    Back to Cases
  </button>

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-bold text-gray-900">{{ caseName }}</h1>
      <span [class]="getStatusColor(caseStatus)" class="px-3 py-1 rounded text-xs font-medium">
        {{ caseStatus }}
      </span>
      <span [class]="getRiskScoreColor()" class="px-3 py-1 rounded text-xs font-medium">
        Risk Score: {{ riskScore }}%
      </span>
    </div>
    <button class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium">
      <lucide-icon name="download" class="flex w-4 h-4"></lucide-icon>
      Download Report
    </button>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-6">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-sm">
      <div>
        <p class="text-gray-500 font-medium mb-1">Case ID</p>
        <p class="font-semibold text-gray-900">{{ caseId }}</p>
      </div>
      <div>
        <p class="text-gray-500 font-medium mb-1">ID Number</p>
        <p class="font-semibold text-gray-900">{{ idNumber }}</p>
      </div>
      <div>
        <p class="text-gray-500 font-medium mb-1">Assigned To</p>
        <p class="font-semibold text-gray-900">{{ assignedTo }}</p>
      </div>
      <div>
        <p class="text-gray-500 font-medium mb-1">Amount</p>
        <p class="font-semibold text-gray-900">{{ amount }}</p>
      </div>
    </div>
  </div>
</div>
