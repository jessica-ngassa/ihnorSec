<div class="filter-panel bg-white p-6 h-full border-r border-gray-100">
  <h4 class="text-gray-400 text-xs font-semibold uppercase tracking-wider mb-6">Filters</h4>

  <div class="mb-8">
    <label class="block text-sm font-medium text-gray-700 mb-4">Fraud Score Range</label>
    <div class="flex items-center gap-2 mb-2">
      <nz-input-number [(ngModel)]="rangeMin" [nzMin]="0" [nzMax]="100" class="w-full rounded-lg"></nz-input-number>
      <span class="text-gray-400 text-xs">to</span>
      <nz-input-number [(ngModel)]="rangeMax" [nzMin]="0" [nzMax]="100" class="w-full rounded-lg"></nz-input-number>
    </div>
    <nz-slider nzRange [(ngModel)]="rangeValue" (ngModelChange)="applyFilters()"></nz-slider>
  </div>

  <div class="mb-8">
    <label class="block text-sm font-medium text-gray-700 mb-2">Document Available</label>
    <nz-select class="w-full" [(ngModel)]="documentValue" (ngModelChange)="applyFilters()">
      @for (option of documentOptions; track option) {
        <nz-option [nzValue]="option" [nzLabel]="option"></nz-option>
      }
    </nz-select>
  </div>

  <button nz-button nzBlock class="!border-brand-blue !text-brand-blue !h-10 font-medium rounded-lg mt-auto" (click)="resetFilters()">
    Reset Filters
  </button>
</div>
