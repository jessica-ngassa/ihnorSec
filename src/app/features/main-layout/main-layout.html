<nz-layout class="layout-shell">
  <nz-sider nzWidth="260px" class="app-sider">
    <div class="flex flex-col h-full">
      
      <div class="p-6 mb-4">
        <div class="flex items-center gap-3">
          <div class="logo-icon-box">
            <lucide-icon name="shield" class="w-5 h-5 text-white"></lucide-icon>
          </div>
          <span class="text-[var(--color-brand-blue)] font-bold text-lg tracking-tight">IHNOR Secure</span>
        </div>
        <p class="text-gray-400 text-xs font-medium m-0">{{ currentTitle() || 'Dashboard' }}</p>
      </div>

      <ul nz-menu nzMode="inline" class="border-none flex-grow">
        @for (item of menuItems; track item.path) {
          <li nz-menu-item [routerLink]="item.path" routerLinkActive="ant-menu-item-selected" class="sidebar-nav-item">
            <span nz-icon [nzType]="item.icon" class="mr-2"></span>
            <span>{{ item.label }}</span>
          </li>
        }
      </ul>

      <div class="p-4 border-tdqws  qew">
        <button class="flex items-center gap-3 text-gray-500 hover:text-red-600" routerLink="/auth/login">
          <span nz-icon nzType="logout"></span>
          <span class="font-medium">Logout</span>
        </button>
      </div>
    </div>
  </nz-sider>

  <nz-layout class="content-shell">
    <nz-header class="app-header-reset">
      <app-header [currentPage]="currentTitle()"></app-header>
    </nz-header>

    <nz-content class="p-8">
      <div>
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
