<div class="mt-8 border border-gray-200 rounded-xl overflow-hidden bg-white">
  <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
    <div class="flex items-center gap-2">
      <lucide-icon name="bar-chart-2" class="w-4 h-4 text-gray-500"></lucide-icon>
      <span class="font-semibold text-sm text-gray-900">Data Preview</span>
      <span class="text-xs text-gray-500 ml-1">Showing {{ data().length }} of {{ totalRows() }} rows</span>
    </div>
    <button (click)="remove.emit()" class="text-xs text-red-600 hover:underline font-medium">
      Remove File
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-xs text-left">
      <thead class="bg-gray-100 text-gray-600 font-medium border-b border-gray-200">
        <tr>
          @for (column of columns(); track column) {
            <th class="px-4 py-3">{{ column }}</th>
          }
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        @for (row of data(); track $index) {
          <tr class="hover:bg-gray-50">
            @for (column of columns(); track column) {
              <td class="px-4 py-3 text-gray-900">{{ row[column] || '-' }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="bg-green-50 p-3 flex items-center gap-2 border-t border-green-100">
    <lucide-icon name="check" class="w-4 h-4 text-green-600"></lucide-icon>
    <span class="text-xs text-green-800 font-medium"
      >File validated: {{ totalRows() }} records ready for analysis</span
    >
  </div>
</div>
