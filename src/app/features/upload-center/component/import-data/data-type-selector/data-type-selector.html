<div>
  <div class="flex items-center gap-1 mb-3">
    <span class="text-red-500 font-bold">*</span>
    <h3 class="text-sm font-semibold text-gray-900">
      Step 1: What type of data are you uploading?
    </h3>
  </div>
  <p class="text-xs text-gray-500 mb-4">
    This helps us apply the right fraud detection algorithms to your data
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (type of types; track type.id) {
      <button
        (click)="!readonly() && select(type.id)"
        class="p-4 border rounded-xl text-left transition-all duration-200 flex flex-col gap-2 relative overflow-hidden"
        [class.border-[#1F3A7D]]="selected() === type.id"
        [class.bg-blue-50]="selected() === type.id"
        [class.border-gray-200]="selected() !== type.id"
        [class.cursor-default]="readonly()"
        [class.hover:shadow-md]="!readonly()"
      >
        <div class="flex items-start gap-3">
          <span class="text-2xl">{{ type.icon }}</span>
          <div>
            <h4
              class="font-semibold text-sm mb-1"
              [class.text-[#1F3A7D]]="selected() === type.id"
              [class.text-gray-900]="selected() !== type.id"
            >
              {{ type.title }}
            </h4>
            <p class="text-xs text-gray-500 leading-snug">{{ type.desc }}</p>
          </div>
        </div>
      </button>
    }
  </div>
</div>
