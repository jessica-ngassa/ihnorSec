<div class="flex flex-col items-center justify-center py-8">

      <div class="mb-4">
        <div class="w-16 h-16 rounded-full bg-green-50 flex items-center justify-center border-4 border-green-100">
          <lucide-icon name="check" class="w-8 h-8 text-green-600" strokeWidth="3"></lucide-icon>
        </div>
      </div>

      <h2 class="text-lg font-bold text-[#1F3A7D] mb-1">Data Analysis Complete!</h2>
      <p class="text-sm text-gray-500 mb-8">Your files have been successfully processed and analyzed</p>

      <div class="grid grid-cols-2 gap-4 w-full max-w-lg mb-8">
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
          <p class="text-xs text-gray-500 mb-1">Records Processed</p>
          <p class="text-xl font-bold text-[#1F3A7D]">208</p>
        </div>
        <div class="bg-red-50 p-4 rounded-xl border border-red-100">
          <p class="text-xs text-gray-500 mb-1">High-Risk Cases</p>
          <p class="text-xl font-bold text-red-600">10</p>
        </div>
        <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
          <p class="text-xs text-gray-500 mb-1">Duplicates Found</p>
          <p class="text-xl font-bold text-orange-600">4</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-xl border border-purple-100">
          <p class="text-xs text-gray-500 mb-1">Anomalies Detected</p>
          <p class="text-xl font-bold text-purple-600">16</p>
        </div>
      </div>

      <div class="flex gap-4">
        <button (click)="uploadMore.emit()" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-medium text-sm transition-colors">
          Upload More Files
        </button>
        <button (click)="viewReport.emit()" class="px-6 py-3 bg-[#1F3A7D] text-white rounded-lg hover:bg-[#2B4C9F] font-medium text-sm shadow-lg shadow-blue-900/20 transition-colors">
          View Detailed Report
        </button>
      </div>
    </div>
